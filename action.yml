name: "DProvenanceKit regression gate"
description: "Fail a pull request when an agent's instrumented decision path regresses, or when a VerificationReceipt is incomplete/tampered."
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  gate-mode:
    description: "Which gate to run: path (decision-path regression, default) | receipt (Verification Receipt CI gate)."
    required: false
    default: "path"
  receipt-path:
    description: "Path to a VerificationReceipt JSON document. Required when gate-mode=receipt."
    required: false
    default: ""
  invariant-path:
    description: "Path to a VerificationInvariant JSON document. Defaults to the vendored claim-path-v1 fixture."
    required: false
    default: ""
  fail-on-receipt-statuses:
    description: "Comma-separated receipt statuses that fail the job (receipt mode). Default: incomplete,tampered."
    required: false
    default: "incomplete,tampered"
  fail-on-receipt:
    description: "Fail the job when the receipt status is in fail-on-receipt-statuses (true | false)."
    required: false
    default: "true"
  db-path:
    description: "Path to the SQLite trace database containing both runs. Required when gate-mode=path."
    required: false
    default: ""
  golden-db:
    description: "SQLite db holding the golden run, if separate from db-path (e.g. a restored baseline)."
    required: false
    default: ""
  candidate-db:
    description: "SQLite db holding the candidate run, if separate from db-path."
    required: false
    default: ""
  golden-run-id:
    description: "Run id of the golden (known-good) trace. Provide this or golden-context."
    required: false
    default: ""
  candidate-run-id:
    description: "Run id of the candidate trace to gate. Provide this or candidate-context."
    required: false
    default: ""
  golden-context:
    description: "Instead of golden-run-id: use the newest run with this context id as the golden."
    required: false
    default: ""
  candidate-context:
    description: "Instead of candidate-run-id: use the newest run with this context id as the candidate (anomaly rules resolve it the same way)."
    required: false
    default: ""
  max-level:
    description: "Worst regression severity that still passes: none | low | medium | high."
    required: false
    default: "none"
  allow-divergent:
    description: "Tolerate per-step changes; gate only on severity (true | false)."
    required: false
    default: "false"
  fail-on-regression:
    description: "Fail the job when a regression is detected (true | false)."
    required: false
    default: "true"
  comment:
    description: "Post a sticky summary comment on the pull request (true | false)."
    required: false
    default: "true"
  anomaly-rules:
    description: "Path to a JSON rules config. When set, runs the out-of-the-box anomaly rules over the candidate run."
    required: false
    default: ""
  fail-on-anomaly:
    description: "Fail the job when an anomaly rule fires (true | false)."
    required: false
    default: "false"
  install-spec:
    description: "pip requirement to install the gate from. Default is pinned to the released gate package; override only for deliberate upgrades or VCS installs."
    required: false
    default: "dprovenancekit==0.7.0"
  python-version:
    description: "Python version to set up."
    required: false
    default: "3.x"
  cloud-mode:
    description: "Customer BYO cloud ingest only ('off', 'optional', 'required'). There is no DProvenanceKit-hosted service. Default 'off'. When enabled, cloud-url is required (fail closed if missing)."
    required: false
    default: "off"
  cloud-url:
    description: "Customer-supplied cloud base URL (BYO). Required when cloud-mode is optional or required. No default host — there is no DProvenanceKit-hosted API."
    required: false
    default: ""
  cloud-api-key:
    description: "API key for customer BYO cloud ingestion (unused when cloud-mode=off)."
    required: false
    default: ""
  project-id:
    description: "Project ID for customer BYO cloud ingest (unused when cloud-mode=off)."
    required: false
    default: ""
  promote-baseline:
    description: "If true and the gate passes, promote the candidate run to a golden baseline."
    required: false
    default: "false"
  default-branch:
    description: >
      The default branch of the repository, used to enforce baseline promotion.
    required: false
    default: "main"
  artifacts:
    description: "JSON array of artifacts to attach to the ingested run (e.g. FlakeDoctor report)."
    required: false
    default: "[]"
  artifact-paths:
    description: "JSON array of paths to upload to the customer BYO cloud endpoint (unused when cloud-mode=off)."
    required: false
    default: "[]"
  upload-trace-database:
    description: "Upload the SQLite trace database to the CI artifact."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment. Defaults to the job's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: "true when the active gate passed, false otherwise."
    value: ${{ steps.gate.outputs.passed || steps.receipt.outputs.passed }}
  regression-level:
    description: "Engine-assessed severity: none | low | medium | high (path mode)."
    value: ${{ steps.gate.outputs.regression-level || steps.receipt.outputs.regression-level || 'none' }}
  summary:
    description: "Human-readable gate summary."
    value: ${{ steps.gate.outputs.summary || steps.receipt.outputs.summary }}
  report-json:
    description: "Full gate report as a JSON string."
    value: ${{ steps.gate.outputs.report-json || steps.receipt.outputs.report-json }}
  anomaly-count:
    description: "Number of anomalies the rules fired on (0 when anomaly-rules is unset)."
    value: "${{ steps.anomalies.outputs.anomaly-count || '0' }}"
  anomalies-json:
    description: "Anomaly findings as a JSON string ('{}' when anomaly-rules is unset)."
    value: "${{ steps.anomalies.outputs.anomalies-json || '{}' }}"
  receipt-status:
    description: "Recomputed VerificationReceipt status: verified | incomplete | tampered (receipt mode)."
    value: ${{ steps.receipt.outputs.receipt-status || '' }}
  receipt-reason:
    description: "Short reason for the recomputed receipt status (receipt mode)."
    value: ${{ steps.receipt.outputs.receipt-reason || '' }}
  receipt-invariant-id:
    description: "Invariant id used for evaluation (receipt mode)."
    value: ${{ steps.receipt.outputs.receipt-invariant-id || '' }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dprovenancekit
      if: ${{ inputs.gate-mode != 'receipt' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ inputs.install-spec }}"

    - name: Run regression gate
      id: gate
      if: ${{ inputs.gate-mode != 'receipt' }}
      shell: bash
      run: |
        if [ -z "${{ inputs.db-path }}" ]; then
          echo "::error title=DProvenanceKit::db-path is required when gate-mode=path"
          exit 2
        fi
        python "${{ github.action_path }}/run_gate.py"
      env:
        DPROV_DB: ${{ inputs.db-path }}
        DPROV_GOLDEN_DB: ${{ inputs.golden-db || inputs.db-path }}
        DPROV_CANDIDATE_DB: ${{ inputs.candidate-db || inputs.db-path }}
        DPROV_GOLDEN: ${{ inputs.golden-run-id }}
        DPROV_GOLDEN_CONTEXT: ${{ inputs.golden-context }}
        DPROV_CANDIDATE: ${{ inputs.candidate-run-id }}
        DPROV_CANDIDATE_CONTEXT: ${{ inputs.candidate-context }}
        DPROV_MAX_LEVEL: ${{ inputs.max-level }}
        DPROV_ALLOW_DIVERGENT: ${{ inputs.allow-divergent }}
        DPROV_CLOUD_MODE: ${{ inputs.cloud-mode }}
        DPROV_CLOUD_URL: ${{ inputs.cloud-url }}
        DPROV_CLOUD_API_KEY: ${{ inputs.cloud-api-key }}
        DPROV_PROJECT_ID: ${{ inputs.project-id }}
        DPROV_PROMOTE_BASELINE: ${{ inputs.promote-baseline }}
        DPROV_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        DPROV_ARTIFACTS: ${{ inputs.artifacts }}
        DPROV_ARTIFACT_PATHS: ${{ inputs.artifact-paths }}
        DPROV_UPLOAD_TRACE_DATABASE: ${{ inputs.upload-trace-database }}

    - name: Run anomaly rules
      id: anomalies
      if: ${{ inputs.gate-mode != 'receipt' && inputs.anomaly-rules != '' }}
      shell: bash
      run: python "${{ github.action_path }}/run_anomalies.py"
      env:
        DPROV_DB: ${{ inputs.db-path }}
        DPROV_CANDIDATE: ${{ inputs.candidate-run-id }}
        DPROV_CANDIDATE_CONTEXT: ${{ inputs.candidate-context }}
        DPROV_ANOMALY_RULES: ${{ inputs.anomaly-rules }}

    - name: Run Verification Receipt gate
      id: receipt
      if: ${{ inputs.gate-mode == 'receipt' }}
      shell: bash
      run: python "${{ github.action_path }}/receipt_gate.py"
      env:
        DPROV_RECEIPT_PATH: ${{ inputs.receipt-path }}
        DPROV_INVARIANT_PATH: ${{ inputs.invariant-path }}
        DPROV_FAIL_ON_RECEIPT_STATUSES: ${{ inputs.fail-on-receipt-statuses }}

    - name: Comment on pull request (path gate)
      if: ${{ inputs.gate-mode != 'receipt' && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      run: python "${{ github.action_path }}/pr_comment.py"
      env:
        DPROV_REPORT_JSON: ${{ steps.gate.outputs.report-json }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Comment on pull request (receipt gate)
      if: ${{ inputs.gate-mode == 'receipt' && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      run: python "${{ github.action_path }}/receipt_pr_comment.py"
      env:
        DPROV_REPORT_JSON: ${{ steps.receipt.outputs.report-json }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Enforce gate
      if: ${{ inputs.gate-mode != 'receipt' && inputs.fail-on-regression == 'true' && steps.gate.outputs.passed != 'true' }}
      shell: bash
      run: |
        echo "::error title=DProvenanceKit::Regression gate failed (severity: ${{ steps.gate.outputs.regression-level }})"
        exit 1

    - name: Enforce Verification Receipt gate
      if: ${{ inputs.gate-mode == 'receipt' && inputs.fail-on-receipt == 'true' && steps.receipt.outputs.passed != 'true' }}
      shell: bash
      run: |
        echo "::error title=DProvenanceKit::Verification Receipt gate failed (status: ${{ steps.receipt.outputs.receipt-status }})"
        exit 1

    - name: Upload artifacts
      if: ${{ always() && inputs.gate-mode != 'receipt' && inputs.upload-trace-database == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: dprovenancekit-reproduction
        path: |
          ${{ inputs.db-path }}
          flake-report.json
        if-no-files-found: ignore

    - name: Enforce anomaly rules
      if: ${{ inputs.gate-mode != 'receipt' && inputs.fail-on-anomaly == 'true' && steps.anomalies.outputs.anomaly-count != '' && steps.anomalies.outputs.anomaly-count != '0' }}
      shell: bash
      run: |
        echo "::error title=DProvenanceKit::${{ steps.anomalies.outputs.anomaly-count }} anomaly rule(s) fired"
        exit 1
