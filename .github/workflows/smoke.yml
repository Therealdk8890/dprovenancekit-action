name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Record golden + candidate traces
        run: |
          python -m pip install --disable-pip-version-check dprovenancekit
          python smoke/record_runs.py

      - name: Gate candidate against golden (context selection, the published action path)
        id: gate
        uses: ./
        with:
          db-path: smoke-traces.sqlite
          golden-context: golden
          candidate-context: candidate
          comment: "false"

      - name: Assert the gate passed
        run: |
          echo "passed=${{ steps.gate.outputs.passed }} level=${{ steps.gate.outputs.regression-level }}"
          test "${{ steps.gate.outputs.passed }}" = "true"

      - name: Gate a regressed candidate against golden (must FAIL the gate)
        id: gate_fail
        uses: ./
        with:
          db-path: smoke-traces.sqlite
          golden-context: golden
          candidate-context: regressed
          comment: "false"
          # Don't fail the job — we assert on the output. This is the negative fixture:
          # it proves the gate reports a failure rather than silently passing everything.
          fail-on-regression: "false"

      - name: Assert the gate failed on the regression
        run: |
          echo "passed=${{ steps.gate_fail.outputs.passed }} level=${{ steps.gate_fail.outputs.regression-level }}"
          test "${{ steps.gate_fail.outputs.passed }}" = "false"
