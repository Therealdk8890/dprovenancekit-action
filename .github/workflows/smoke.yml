name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Byte-compile all Python sources
        run: python -m compileall -q .

      - name: Unit-test gate evaluators and Regression Intelligence v1
        run: python -m unittest discover -s tests -v

      - name: Record golden + candidate traces
        run: |
          python -m pip install --disable-pip-version-check 'dprovenancekit==0.10.0'
          python smoke/record_runs.py

      - name: Gate candidate against golden (context selection, the published action path)
        id: gate
        uses: ./
        with:
          db-path: smoke-traces.sqlite
          golden-context: golden
          candidate-context: candidate
          comment: "false"

      - name: Assert the gate passed
        env:
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          GATE_REGRESSION_LEVEL: ${{ steps.gate.outputs.regression-level }}
          GATE_FINDING_COUNT: ${{ steps.gate.outputs.finding-count }}
        run: |
          echo "passed=${GATE_PASSED} level=${GATE_REGRESSION_LEVEL} findings=${GATE_FINDING_COUNT}"
          test "${GATE_PASSED}" = "true"
          test "${GATE_FINDING_COUNT}" = "0"

      - name: Gate a regressed candidate against golden (must FAIL the gate)
        id: gate_fail
        uses: ./
        with:
          db-path: smoke-traces.sqlite
          golden-context: golden
          candidate-context: regressed
          comment: "false"
          # Don't fail the job — we assert on the output. This is the negative fixture:
          # it proves the gate reports a failure rather than silently passing everything.
          fail-on-regression: "false"

      - name: Assert the gate failed on the regression
        env:
          GATE_FAIL_PASSED: ${{ steps.gate_fail.outputs.passed }}
          GATE_FAIL_REGRESSION_LEVEL: ${{ steps.gate_fail.outputs.regression-level }}
          GATE_FAIL_FINDING_COUNT: ${{ steps.gate_fail.outputs.finding-count }}
        run: |
          echo "passed=${GATE_FAIL_PASSED} level=${GATE_FAIL_REGRESSION_LEVEL} findings=${GATE_FAIL_FINDING_COUNT}"
          test "${GATE_FAIL_PASSED}" = "false"
          test "${GATE_FAIL_FINDING_COUNT}" != "0"
