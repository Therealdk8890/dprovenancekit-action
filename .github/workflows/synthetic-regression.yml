name: Synthetic regression demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/synthetic-regression
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Unit-test gate evaluators and Regression Intelligence v1
        working-directory: .
        run: python -m unittest discover -s tests -v

      - name: Record golden, matching, and intentionally regressed traces
        run: |
          python -m pip install --disable-pip-version-check 'dprovenancekit==0.11.0'
          python record_traces.py

      - name: Gate matching candidate (must PASS)
        id: gate_ok
        uses: ./
        with:
          db-path: examples/synthetic-regression/demo-traces.sqlite
          golden-context: golden
          candidate-context: candidate
          comment: "false"

      - name: Assert matching candidate passed
        env:
          GATE_OK_PASSED: ${{ steps.gate_ok.outputs.passed }}
          GATE_OK_REGRESSION_LEVEL: ${{ steps.gate_ok.outputs.regression-level }}
        run: |
          echo "passed=${GATE_OK_PASSED} level=${GATE_OK_REGRESSION_LEVEL}"
          test "${GATE_OK_PASSED}" = "true"

      - name: Gate regressed candidate that dropped verify (must FAIL the gate)
        id: gate_bad
        uses: ./
        with:
          db-path: examples/synthetic-regression/demo-traces.sqlite
          golden-context: golden
          candidate-context: regressed
          comment: "false"
          # Keep the job alive so we can assert the Action reported failure.
          fail-on-regression: "false"

      - name: Assert regressed candidate failed the gate
        env:
          GATE_BAD_PASSED: ${{ steps.gate_bad.outputs.passed }}
          GATE_BAD_REGRESSION_LEVEL: ${{ steps.gate_bad.outputs.regression-level }}
        run: |
          echo "passed=${GATE_BAD_PASSED} level=${GATE_BAD_REGRESSION_LEVEL}"
          test "${GATE_BAD_PASSED}" = "false"
