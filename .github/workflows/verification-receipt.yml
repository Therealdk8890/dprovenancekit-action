name: Verification Receipt gate demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Unit tests (stdlib unittest)
        run: python -m unittest tests.test_receipt_gate -v

  scoreboard:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Receipt verified (must PASS)
        id: verified
        uses: ./
        with:
          gate-mode: receipt
          receipt-path: fixtures/verification-receipt/verified.json
          comment: "false"

      - name: Assert verified passed
        env:
          VERIFIED_RECEIPT_STATUS: ${{ steps.verified.outputs.receipt-status }}
          VERIFIED_PASSED: ${{ steps.verified.outputs.passed }}
        run: |
          echo "status=${VERIFIED_RECEIPT_STATUS} passed=${VERIFIED_PASSED}"
          test "${VERIFIED_PASSED}" = "true"
          test "${VERIFIED_RECEIPT_STATUS}" = "verified"

      - name: Receipt incomplete (must FAIL the gate)
        id: incomplete
        uses: ./
        with:
          gate-mode: receipt
          receipt-path: fixtures/verification-receipt/incomplete.json
          comment: "false"
          # Keep the job alive so we can assert the Action reported failure.
          fail-on-receipt: "false"

      - name: Assert incomplete failed
        env:
          INCOMPLETE_RECEIPT_STATUS: ${{ steps.incomplete.outputs.receipt-status }}
          INCOMPLETE_PASSED: ${{ steps.incomplete.outputs.passed }}
        run: |
          echo "status=${INCOMPLETE_RECEIPT_STATUS} passed=${INCOMPLETE_PASSED}"
          test "${INCOMPLETE_PASSED}" = "false"
          test "${INCOMPLETE_RECEIPT_STATUS}" = "incomplete"

      - name: Receipt tampered (must FAIL the gate)
        id: tampered
        uses: ./
        with:
          gate-mode: receipt
          receipt-path: fixtures/verification-receipt/tampered.json
          comment: "false"
          fail-on-receipt: "false"

      - name: Assert tampered failed
        env:
          TAMPERED_RECEIPT_STATUS: ${{ steps.tampered.outputs.receipt-status }}
          TAMPERED_PASSED: ${{ steps.tampered.outputs.passed }}
        run: |
          echo "status=${TAMPERED_RECEIPT_STATUS} passed=${TAMPERED_PASSED}"
          test "${TAMPERED_PASSED}" = "false"
          test "${TAMPERED_RECEIPT_STATUS}" = "tampered"

      - name: Scoreboard summary
        if: always()
        env:
          VERIFIED_PASSED: ${{ steps.verified.outputs.passed }}
          VERIFIED_RECEIPT_STATUS: ${{ steps.verified.outputs.receipt-status }}
          INCOMPLETE_PASSED: ${{ steps.incomplete.outputs.passed }}
          INCOMPLETE_RECEIPT_STATUS: ${{ steps.incomplete.outputs.receipt-status }}
          TAMPERED_PASSED: ${{ steps.tampered.outputs.passed }}
          TAMPERED_RECEIPT_STATUS: ${{ steps.tampered.outputs.receipt-status }}
        run: |
          {
            echo "### Verification Receipt scoreboard"
            echo ""
            echo "| Fixture | Expected | Result |"
            echo "| --- | --- | --- |"
            echo "| verified.json | PASS | ${VERIFIED_PASSED} (${VERIFIED_RECEIPT_STATUS}) |"
            echo "| incomplete.json | FAIL | passed=${INCOMPLETE_PASSED} (${INCOMPLETE_RECEIPT_STATUS}) |"
            echo "| tampered.json | FAIL | passed=${TAMPERED_PASSED} (${TAMPERED_RECEIPT_STATUS}) |"
          } >> "$GITHUB_STEP_SUMMARY"
