# Manual blocking regression proof — the negative job is intentionally red.
# Run via Actions > Blocking regression proof > Run workflow.
# The green control job proves the same fixture passes without the regression.
name: Blocking regression proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-must-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install fixture recorder
        run: python -m pip install --disable-pip-version-check 'dprovenancekit==0.9.2'
      - name: Record baseline and candidate
        run: python examples/observability-contrast/record_traces.py
      - name: Gate identical instrumented paths
        id: baseline
        uses: ./
        with:
          gate-mode: path
          db-path: examples/observability-contrast/demo-traces.sqlite
          golden-context: golden
          candidate-context: baseline
          install-spec: dprovenancekit==0.9.2
          fail-on-regression: "true"
          comment: "false"
      - name: Verify passing verdict
        shell: bash
        env:
          PASSED: ${{ steps.baseline.outputs.passed }}
        run: test "$PASSED" = true

  regression-must-block:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install fixture recorder
        run: python -m pip install --disable-pip-version-check 'dprovenancekit==0.9.2'
      - name: Record baseline and regressed candidate
        run: python examples/observability-contrast/record_traces.py
      - name: Gate dropped verification step (expected to fail job)
        uses: ./
        with:
          gate-mode: path
          db-path: examples/observability-contrast/demo-traces.sqlite
          golden-context: golden
          candidate-context: regressed
          install-spec: dprovenancekit==0.9.2
          fail-on-regression: "true"
          comment: "false"
