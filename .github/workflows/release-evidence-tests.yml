name: Release evidence verifier tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Verify positive, tamper, and trust-boundary tests
        run: python -m unittest discover -s tests -p "test_*evidence.py" -v
      - name: Compile evidence verifier modules
        run: python -m compileall -q scripts/release_evidence.py scripts/verify_authenticated_evidence.py
