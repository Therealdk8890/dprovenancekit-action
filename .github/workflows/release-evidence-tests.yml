name: Release evidence verifier tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install signing test dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=42,<47"
      - name: Verify positive, tamper, and trust-boundary tests
        run: python -m unittest discover -s tests -p "test*release_evidence.py" -v
