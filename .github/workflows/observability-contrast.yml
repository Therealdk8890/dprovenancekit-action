name: Observability contrast demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/observability-contrast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install DPK (Action install-spec pin)
        run: python -m pip install --disable-pip-version-check 'dprovenancekit==0.11.0'

      - name: Record baseline + regressed traces
        run: python record_traces.py

      - name: Mock observability + LLM-eval on regressed run (expect PASS)
        id: mocks
        run: |
          set -euo pipefail
          ANSWER=$(python -c "from agent import run_regressed; print(run_regressed())")
          echo "regressed_answer=$ANSWER"
          python mock_observability.py "$ANSWER"
          python mock_llm_eval.py "$ANSWER"
          BASE=$(python -c "from agent import run_baseline; print(run_baseline())")
          python mock_observability.py "$BASE"
          python mock_llm_eval.py "$BASE"
          echo "passed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Mock checkers (regressed run that dropped verify)"
            echo ""
            echo "- Output / HTTP / fake-trace: **PASS**"
            echo "- LLM eval (answer looks plausible): **PASS**"
            echo "- Answer: \`$ANSWER\`"
            echo ""
            echo "Mocks stayed green. Next steps show DPK FAIL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: DPK path gate — baseline (must PASS)
        id: path_ok
        uses: ./
        with:
          gate-mode: path
          db-path: examples/observability-contrast/demo-traces.sqlite
          golden-context: golden
          candidate-context: baseline
          comment: "false"

      - name: Assert baseline path gate passed
        env:
          PATH_OK_PASSED: ${{ steps.path_ok.outputs.passed }}
          PATH_OK_REGRESSION_LEVEL: ${{ steps.path_ok.outputs.regression-level }}
        run: |
          echo "passed=${PATH_OK_PASSED} level=${PATH_OK_REGRESSION_LEVEL}"
          test "${PATH_OK_PASSED}" = "true"

      - name: DPK Verification Receipt — verified fixture (must PASS)
        id: receipt_ok
        uses: ./
        with:
          gate-mode: receipt
          receipt-path: fixtures/verification-receipt/verified.json
          comment: "false"

      - name: Assert verified receipt passed
        env:
          RECEIPT_OK_RECEIPT_STATUS: ${{ steps.receipt_ok.outputs.receipt-status }}
          RECEIPT_OK_PASSED: ${{ steps.receipt_ok.outputs.passed }}
        run: |
          echo "status=${RECEIPT_OK_RECEIPT_STATUS} passed=${RECEIPT_OK_PASSED}"
          test "${RECEIPT_OK_PASSED}" = "true"
          test "${RECEIPT_OK_RECEIPT_STATUS}" = "verified"

      - name: DPK path gate — regressed / verify dropped (capture FAIL for scoreboard)
        id: path_bad
        uses: ./
        with:
          gate-mode: path
          db-path: examples/observability-contrast/demo-traces.sqlite
          golden-context: golden
          candidate-context: regressed
          comment: "false"
          # Keep alive so the scoreboard can print the contrast, then fail below.
          fail-on-regression: "false"

      - name: DPK Verification Receipt — incomplete / verify missing (capture FAIL)
        id: receipt_bad
        uses: ./
        with:
          gate-mode: receipt
          receipt-path: fixtures/verification-receipt/incomplete.json
          comment: "false"
          fail-on-receipt: "false"

      - name: Print five-row scoreboard (mocks PASS, DPK FAIL)
        env:
          PATH_OK_PASSED: ${{ steps.path_ok.outputs.passed }}
          PATH_BAD_PASSED: ${{ steps.path_bad.outputs.passed }}
          RECEIPT_OK_PASSED: ${{ steps.receipt_ok.outputs.passed }}
          RECEIPT_OK_RECEIPT_STATUS: ${{ steps.receipt_ok.outputs.receipt-status }}
          RECEIPT_BAD_PASSED: ${{ steps.receipt_bad.outputs.passed }}
          RECEIPT_BAD_RECEIPT_STATUS: ${{ steps.receipt_bad.outputs.receipt-status }}
          MOCKS_PASSED: ${{ steps.mocks.outputs.passed }}
        run: |
          {
            echo "### Observability-PASS / DPK-FAIL scoreboard"
            echo ""
            echo "| Check | Baseline | Regressed (verify dropped) |"
            echo "| --- | --- | --- |"
            echo "| Output test | PASS | PASS |"
            echo "| LLM eval | PASS | PASS |"
            echo "| Mock OTel/LangSmith-style | PASS | PASS |"
            echo "| DPK path gate | ${PATH_OK_PASSED} | **${PATH_BAD_PASSED}** (expect false) |"
            echo "| DPK Verification Receipt | ${RECEIPT_OK_PASSED} (${RECEIPT_OK_RECEIPT_STATUS}) | **${RECEIPT_BAD_PASSED}** (${RECEIPT_BAD_RECEIPT_STATUS}) |"
            echo ""
            echo "Mocks stayed green. DPK caught the missing \`verify\`."
            echo "Verified ≠ claim true. Path/provenance control complements LangSmith."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${MOCKS_PASSED}" = "true"
          test "${PATH_OK_PASSED}" = "true"
          test "${RECEIPT_OK_PASSED}" = "true"
          test "${PATH_BAD_PASSED}" = "false"
          test "${RECEIPT_BAD_PASSED}" = "false"
          python run_scoreboard.py

      - name: Confirm regression was caught (CI remains green)
        run: |
          echo "DPK correctly detected the verify-dropped regression."
          echo "The failure is represented in the scoreboard; this demo workflow intentionally exits 0."
